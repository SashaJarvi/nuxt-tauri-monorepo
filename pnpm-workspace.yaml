packages:
  - "apps/*"
  - "packages/*"

# Supply-chain hardening: only install package versions that have been
# published for at least this many minutes (10080 = 1 week). Requires pnpm >= 10.16.
minimumReleaseAge: 10080

# Dependencies explicitly allowed to run install/postinstall build scripts
# (pnpm >= 10 blocks all others by default). These ship prebuilt native
# binaries via optionalDependencies, so approving them is low-risk.
onlyBuiltDependencies:
  - "@parcel/watcher"
  - esbuild
  - unrs-resolver
  - vue-demi

catalog:
  nuxt: "^4.6.2"
  vue: "^3.5.44"
  typescript: "^5.9.3"
  "@nuxt/ui": "^4.12.0"
  "@nuxt/eslint": "^1.17.0"
  "@tauri-apps/api": "^2.12.4"
  "@tauri-apps/cli": "^2.12.4"
  "@tauri-apps/plugin-opener": "^2.7.2"
  "@tauri-apps/plugin-shell": "^2.5.0"
  # Pinned exact due to a streaming bug in newer versions; keep aligned with the
  # Rust `tauri-plugin-http = "=2.8.3"` pin in apps/native/src-tauri/Cargo.toml.
  "@tauri-apps/plugin-http": "2.8.3"
  "@vueuse/core": "^13.9.0"
  "@vueuse/nuxt": "^13.9.0"
  tailwindcss: "^4.3.3"
  radix-vue: "^1.9.17"
  class-variance-authority: "^0.7.1"
  clsx: "^2.1.1"
  tailwind-merge: "^2.6.1"
  zod: "^3.25.76"
  baseline-browser-mapping: "^2.11.31"
  vue-tsc: "^3.3.13"
